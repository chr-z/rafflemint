<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="RaffleMint — transparent verifiable giveaways">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset=".55" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- floating confetti -->
  <g opacity=".55">
    <rect x="90" y="70" width="14" height="22" rx="3" fill="#5eead4" transform="rotate(24 97 81)"/>
    <rect x="180" y="300" width="12" height="18" rx="3" fill="#99f6e4" transform="rotate(-18 186 309)"/>
    <rect x="1080" y="90" width="13" height="20" rx="3" fill="#5eead4" transform="rotate(40 1086 100)"/>
    <rect x="1010" y="320" width="11" height="17" rx="3" fill="#99f6e4" transform="rotate(-30 1015 328)"/>
    <circle cx="260" cy="120" r="6" fill="#fbbf24"/>
    <circle cx="950" cy="140" r="7" fill="#f59e0b"/>
    <circle cx="150" cy="220" r="5" fill="#fbbf24"/>
    <circle cx="1060" cy="230" r="5" fill="#fcd34d"/>
  </g>

  <!-- dice -->
  <g transform="translate(120 210) rotate(-10)">
    <rect x="-58" y="-58" width="116" height="116" rx="26" fill="url(#mint)"/>
    <g fill="#042f2e">
      <circle cx="-26" cy="-26" r="9"/>
      <circle cx="26" cy="-26" r="9"/>
      <circle cx="0" cy="0" r="9"/>
      <circle cx="-26" cy="26" r="9"/>
      <circle cx="26" cy="26" r="9"/>
    </g>
  </g>

  <!-- ticket -->
  <g transform="translate(1075 205) rotate(8)">
    <rect x="-95" y="-60" width="190" height="120" rx="16" fill="url(#mint)"/>
    <line x1="-38" y1="-60" x2="-38" y2="60" stroke="#042f2e" stroke-width="5" stroke-dasharray="10 9"/>
    <text x="-66" y="10" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#042f2e">#01</text>
    <text x="6" y="-6" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#042f2e">WIN</text>
    <text x="6" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#065f46">seed ✓</text>
  </g>

  <!-- headline -->
  <text x="600" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="850" fill="#ffffff">Transparent. Verifiable.</text>
  <text x="600" y="252" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="850" fill="#5eead4">Yours.</text>
  <text x="600" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" fill="#ccfbf1">same list + same seed = same winners — replayable by anyone</text>
</svg>
